name: Build macOS release
description: Report the macOS toolchain and build and verify the release app.

runs:
  using: composite
  steps:
    - name: Report macOS and toolchain versions
      shell: bash
      run: |
        /usr/bin/sw_vers
        /usr/bin/uname -m
        /usr/bin/xcode-select -p
        /usr/bin/xcrun xcodebuild -version
        /usr/bin/xcrun swift --version
        /usr/bin/xcrun --sdk macosx --show-sdk-version
    - name: Build and verify release app
      shell: bash
      run: make build-macos
    - name: Verify bounded streaming integration
      shell: bash
      run: bash apps/client-macos-swift/scripts/performance/build-tests.sh
