[project]
name = "gday-search-worker"
version = "0.1.0"
description = "Local audio retrieval benchmark and embedding worker"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers==4.57.3",
  "huggingface-hub==0.36.0",
  "soundfile>=0.13,<0.14",
]

[project.scripts]
gday-search = "gday_search.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/gday_search"]
